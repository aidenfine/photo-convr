name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-examples libheif-plugin-libde265 libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Install macOS HEIC decoder
        if: runner.os == 'macOS'
        run: brew install libheif

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Install Windows HEIC decoder
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-libheif

      - name: Add Windows HEIC decoder to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> $env:GITHUB_PATH'

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Rust tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run packaging tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build Windows portable package
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/package_windows.py --msys-prefix "${{ steps.msys2.outputs.msys2-location }}\mingw64"

      - name: Upload Windows portable package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Photo-Convr-Windows-x64
          path: |
            dist/*-Windows-x64.zip
            dist/*-Windows-x64.zip.sha256
          if-no-files-found: error
